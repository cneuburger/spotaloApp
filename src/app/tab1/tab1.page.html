<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Tab 1 | {{locAvailable}}
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="map-page" fullscreen="false">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Tab 1a</ion-title>
    </ion-toolbar>
  </ion-header>
  
  @if (!locAvailable) {
    <div><br><p>GPS wird gesucht ...</p></div>
  }

  <div class="map-wrap">
    <capacitor-google-map #mapEl></capacitor-google-map>
    <div id="crosshair" class="crosshair" aria-hidden="true"><span></span></div>
  </div>

  <!--
  <ion-button expand="true" (click)="sheetOpen=true" style="position: absolute; bottom: 0;">Open1</ion-button>
  -->

  <!--
  <ion-button expand="true" (click)="leaveMessage(); sheetOpen=false" style="position: absolute; bottom: 0;">Open2</ion-button>
-->
  <!-- Backdrop & Sheet FIXIERT rendern -->

  <div class="sheet-backdrop" slot="fixed"
       [class.open]="sheetOpen"
       (click)="sheetOpen=false"></div>

  <div class="sheet" slot="fixed"
       [class.open]="sheetOpen"
       (click)="$event.stopPropagation()">
    <div class="sheet-panel">
      <div class="sheet-handle"></div>
      <h3 class="ion-margin-bottom">Aktionen 4</h3>
      <ion-button expand="full">testbutton 4</ion-button>

      <ion-card>
        <ion-card-content>
          Test 4
        </ion-card-content>
      </ion-card>

      <ion-list>
        <ion-item button (click)="leaveMessage(); sheetOpen=false">
          <ion-icon slot="start" name="locate"></ion-icon>
          <ion-label>Hier Nachricht hinterlassen 4</ion-label>
        </ion-item>
        <ion-item button (click)="recommend(); sheetOpen=false">
          <ion-icon slot="start" name="heart"></ion-icon>
          <ion-label>Diesen Ort empfehlen 4</ion-label>
        </ion-item>
        <ion-item button (click)="share(); sheetOpen=false">
          <ion-icon slot="start" name="share-social"></ion-icon>
          <ion-label>Teilen ... 4</ion-label>
        </ion-item>
      </ion-list>
    </div>
  </div>

  <ion-fab vertical="bottom" horizontal="start" slot="fixed">
    <ion-fab-button (click)="onSetPinOnFreePos();">
      <i [ngClass]="currentAddIconClass"></i>
    </ion-fab-button>
  </ion-fab>

  <ion-fab vertical="bottom" horizontal="center" slot="fixed">
    <ion-fab-button (click)="onSetPinOnUserPos();">
      <i [ngClass]="currentAddIconClass"></i>
    </ion-fab-button>
  </ion-fab>

  <ion-fab slot="fixed" vertical="center" horizontal="end">
    <ion-fab-button (click)="locateAndCenterUser()">
      <i class="fa-solid fa-location-crosshairs"></i>
    </ion-fab-button>
  </ion-fab>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button>
      <i class="fa-solid fa-chevron-up"></i>
    </ion-fab-button>
    <ion-fab-list side="top">
      <ion-fab-button (click)="selectPinType('tree')">
        <i class="fa-solid fa-tree"></i>
      </ion-fab-button>
      <ion-fab-button (click)="selectPinType('map-pin')">
        <i class="fa-solid fa-map-pin"></i>
      </ion-fab-button>
      <ion-fab-button (click)="selectPinType('info')">
        <i class="fa-solid fa-circle-info"></i>
      </ion-fab-button>
    </ion-fab-list>
  </ion-fab>  

</ion-content>

<div class="sheet" [class.open]="messageBoxOpen" (click)="messageBoxOpen=false">
  <div class="sheet-panel" (click)="$event.stopPropagation()">
    <div class="sheet-handle"></div>
    <h3 class="ion-margin-bottom">Markierung setzen</h3>
    <ion-list inset="true">
      <ion-item>
        <ion-textarea [(ngModel)]="textMessage" autoGrow="true" placeholder="Nachricht hinterlassen ..."></ion-textarea>
      </ion-item>

      <ion-item>
        <ion-button type="button" expand="full" (click)="onSubmitMessage()">Nachricht senden</ion-button>
        <ion-button type="button" expand="full" (click)="cancelMessage()">Abbrechen</ion-button>
      </ion-item>
    </ion-list>
  </div>
</div>
